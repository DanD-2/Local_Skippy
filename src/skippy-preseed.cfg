# Ubuntu Server 26.04 LTS Preseed Configuration for Skippy Local_LLM Host
# This file enables fully unattended installation

# Localization
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i console-setup/layout string us

# Keyboard
d-i console-setup/variant string US
d-i keyboard-configuration/xkb-keymap select us

# Networking
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 0
d-i netcfg/hostname string Skippy
d-i netcfg/domain string aybara.local
d-i netcfg/wireless_wep string

# Static network configuration (if DHCP is not used, override as needed)
#d-i netcfg/disable_dhcp boolean true
#d-i netcfg/get_ipaddress string 192.168.128.5
#d-i netcfg/get_netmask string 255.255.255.0
#d-i netcfg/get_gateway string 192.168.128.1
#d-i netcfg/get_nameservers string 192.168.128.1 1.1.1.1 8.8.8.8
#d-i netcfg/confirm_static boolean true

# Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# Apt setup
d-i apt-setup/restricted boolean true
d-i apt-setup/universe boolean true
d-i apt-setup/multiverse boolean true
d-i apt-setup/backports boolean true
d-i apt-setup/proposed boolean false
d-i apt-setup/security_path string /security

# Package selection
tasksel tasksel/first multiselect server
d-i pkgsel/include string openssh-server build-essential curl ca-certificates
d-i pkgsel/upgrade select safe
d-i pkgsel/language-pack-patterns string
d-i pkgsel/install-language-support boolean false

# Clock/Time
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string 0.ubuntu.pool.ntp.org

# Partitioning (simple guided partitioning)
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# User creation
d-i passwd/user-fullname string Daniel
d-i passwd/username string daniel
# Password hash will be injected by prepare-ubuntu-server-26.04-usb-autoinstall.ps1
d-i passwd/user-password-crypted string HASH_PLACEHOLDER

# Grub bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

# Finish installation
d-i finish-install/reboot_in_background boolean true
d-i finish-install/keep-console-open boolean false

# Post-installation hook to enable first-boot service
d-i preseed/late_command string \
    in-target systemctl enable local-llm-first-boot.service; \
    in-target systemctl start local-llm-first-boot.service
